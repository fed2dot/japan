<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Япония</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        japanRed: '#E60012',
                        japanGold: '#D4AF37',
                        darkSlate: '#0F172A',
                        cardDark: '#1E293B'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body:not(.edit-mode) .edit-only { display: none !important; }
        body:not(.edit-mode) .field-input {
            background: transparent !important;
            border-color: transparent !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            cursor: default;
            resize: none;
            pointer-events: none;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Фото: адаптивная сетка с фиксированным соотношением сторон */
        .photo-card {
            aspect-ratio: 4 / 3;
            width: 100%;
        }
    </style>
</head>
<body class="bg-darkSlate text-slate-100 font-sans antialiased min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-japanRed flex items-center justify-center font-bold text-white shadow-lg shadow-japanRed/30 shrink-0">⛩️</div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Япония <span class="text-xs px-2 py-0.5 rounded bg-japanRed/20 text-japanRed font-semibold border border-japanRed/30">13 Дней • 16-28 Ноября 2026</span>
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <span id="sync-status" class="text-[11px] text-slate-500 flex items-center gap-1"><i data-lucide="cloud" class="w-3.5 h-3.5"></i> <span id="sync-text">Локально</span></span>
                <button id="btn-edit-toggle" onclick="toggleEditMode()" class="px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-xl border border-slate-700 bg-slate-800 text-slate-300 hover:text-white transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="pencil" class="w-4 h-4"></i> <span id="edit-toggle-label">Редактировать</span>
                </button>
                <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700 overflow-x-auto no-scrollbar">
                    <button id="btn-mode-presentation" onclick="switchMode('presentation')" class="px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all bg-japanRed text-white shadow whitespace-nowrap">
                        <i data-lucide="presentation" class="w-4 h-4 inline mr-1"></i> Презентация
                    </button>
                    <button id="btn-mode-grid" onclick="switchMode('grid')" class="px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all whitespace-nowrap">
                        <i data-lucide="grid" class="w-4 h-4 inline mr-1"></i> 13 Дней
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 flex flex-col gap-6">
        <!-- ============ PRESENTATION ============ -->
        <section id="view-presentation" class="flex flex-col gap-6 flex-1">
            <div class="flex items-center justify-between bg-cardDark p-4 rounded-2xl border border-slate-700/60 shadow-md flex-wrap gap-3">
                <div class="flex items-center space-x-2">
                    <button onclick="prevSlide()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition disabled:opacity-50">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <span id="slide-indicator" class="text-sm font-semibold px-3 py-1 bg-slate-900 rounded-lg text-slate-300 border border-slate-800">16.11 (День 1)</span>
                    <button onclick="nextSlide()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="flex items-center space-x-1 overflow-x-auto no-scrollbar max-w-[240px] sm:max-w-xs">
                    <div id="dots-container" class="flex space-x-1.5"></div>
                </div>
            </div>

            <div class="bg-cardDark border border-slate-700/80 rounded-3xl p-6 lg:p-8 shadow-2xl flex flex-col gap-8 flex-1 relative overflow-hidden">
                <div class="absolute -top-24 -right-24 w-96 h-96 bg-japanRed/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="flex flex-col md:flex-row justify-between items-start md:items-stretch gap-4 z-10 border-b border-slate-800 pb-6">
                    <div class="space-y-2 w-full md:w-3/5">
                        <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                            <span id="slide-date-tag" class="text-xs font-bold uppercase tracking-wider text-japanRed bg-japanRed/10 px-3 py-1 rounded-lg border border-japanRed/20">16.11</span>
                            <input id="slide-city-input" type="text" oninput="updateSlideField('cityTag', this.value)" placeholder="Локация / Маршрут" class="field-input text-slate-300 px-2 py-1 rounded-lg border border-slate-700 bg-slate-900 text-xs font-semibold w-auto min-w-[240px] outline-none focus:border-japanRed" />
                        </div>
                        <input id="slide-title-input" type="text" oninput="updateSlideField('title', this.value)" placeholder="Заголовок дня" class="field-input w-full text-xl lg:text-2xl font-extrabold text-white bg-slate-900/60 border border-slate-700 rounded-xl px-3 py-1.5 outline-none focus:border-japanRed" />
                        <textarea id="slide-subtitle-input" oninput="updateSlideField('subtitle', this.value)" placeholder="Подзаголовок дня" rows="2" class="field-input w-full text-sm text-slate-300 leading-relaxed bg-slate-900/60 border border-slate-700 rounded-xl px-3 py-1.5 outline-none focus:border-japanRed resize-none"></textarea>
                    </div>

                    <div class="w-full md:w-2/5 bg-slate-900/90 border border-slate-800 p-4 rounded-2xl space-y-3 z-10">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <h3 class="text-xs font-bold uppercase tracking-widest text-japanGold flex items-center gap-1.5">
                                <i data-lucide="wallet" class="w-4 h-4 text-japanGold"></i> Бюджет дня (1 чел)
                            </h3>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-center text-xs">
                            <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/60">
                                <span class="text-[10px] text-slate-400 block mb-0.5">🍜 Еда</span>
                                <input id="budget-food-input" type="number" oninput="updateCurrentBudget('food', this.value)" class="field-input w-full bg-slate-900 text-center font-bold text-slate-200 rounded p-1 border border-slate-700 focus:border-japanGold outline-none text-xs" />
                            </div>
                            <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/60">
                                <span class="text-[10px] text-slate-400 block mb-0.5">🚆 Транспорт</span>
                                <input id="budget-transport-input" type="number" oninput="updateCurrentBudget('transport', this.value)" class="field-input w-full bg-slate-900 text-center font-bold text-slate-200 rounded p-1 border border-slate-700 focus:border-japanGold outline-none text-xs" />
                            </div>
                        </div>

                                    <i data-lucide="plus" class="w-3 h-3"></i> Добавить
                                </button>
                            </div>
                            <div id="custom-items-list" class="space-y-1.5"></div>
                        </div>

                        <div class="bg-japanGold/10 border border-japanGold/30 p-2.5 rounded-xl flex items-center justify-between">
                            <span class="text-xs font-semibold text-japanGold flex items-center gap-1">
                                <i data-lucide="coins" class="w-3.5 h-3.5"></i> Итого за день:
                            </span>
                            <div class="text-right">
                                <span id="budget-total-jpy" class="text-sm font-extrabold text-white">~¥0</span>
                                <span id="budget-total-sub" class="text-[10px] text-slate-400 block font-normal">(~0 ₽)</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-3 z-10">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 flex items-center gap-1.5">
                            <i data-lucide="image" class="w-4 h-4 text-japanGold"></i> Фото локации
                        </h3>

                        </button>
                    </div>
                    <div id="slide-photo-gallery" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
                </div>

                <div class="space-y-3 z-10">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-4 h-4 text-japanGold"></i> План Дня
                        </h3>
                        <button onclick="addTimelineItem()" class="edit-only text-xs text-emerald-400 hover:underline flex items-center gap-1 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Добавить
                        </button>
                    </div>
                    <div id="slide-timeline" class="space-y-2.5 bg-slate-900/60 p-4 rounded-2xl border border-slate-800"></div>
                </div>
            </div>
        </section>

        <!-- ============ GRID ============ -->
        <section id="view-grid" class="hidden flex-1 flex flex-col gap-6">
            <div class="bg-cardDark border border-japanGold/40 rounded-3xl p-6 shadow-2xl relative overflow-hidden bg-gradient-to-r from-slate-900 via-cardDark to-slate-900">

                    <div>

                        </div>
                        <h2 class="text-xl lg:text-2xl font-extrabold text-white mt-1">Финальная стоимость поездки</h2>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full lg:w-auto">
                        <div class="bg-slate-800/90 p-3 rounded-2xl border border-slate-700/80 text-center">
                            <span class="text-[11px] text-slate-400 block">🍜 Еда</span>
                            <span id="grand-total-food" class="text-sm font-bold text-slate-200">¥0</span>
                        </div>
                        <div class="bg-slate-800/90 p-3 rounded-2xl border border-slate-700/80 text-center">
                            <span class="text-[11px] text-slate-400 block">🚆 Транспорт</span>
                            <span id="grand-total-transport" class="text-sm font-bold text-slate-200">¥0</span>
                        </div>
                        <div class="bg-slate-800/90 p-3 rounded-2xl border border-slate-700/80 text-center">
                            <span class="text-[11px] text-japanGold block font-semibold">🎟️ Прочее</span>
                            <span id="grand-total-custom" class="text-sm font-bold text-japanGold">¥0</span>

                        <div class="bg-japanRed/20 p-3 rounded-2xl border border-japanRed/40 text-center flex flex-col justify-center">
                            <span class="text-[11px] text-japanRed font-bold uppercase block">ВСЕГО</span>
                            <span id="grand-total-all-jpy" class="text-base font-extrabold text-white">¥0</span>
                            <span id="grand-total-all-sub" class="text-[10px] text-slate-300 block">(~0 ₽)</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>

        ];

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            initPresentationDots();
            loadLocal();          // сначала показываем локальные данные (мгновенно)
            renderSlide(0);
            renderGridCards();
            await loadFromCloud(); // затем подтягиваем из облака (если настроено)
        });

        window.toggleEditMode = function() {
            editMode = !editMode;
            document.body.classList.toggle('edit-mode', editMode);
            const btn = document.getElementById('btn-edit-toggle');
            const label = document.getElementById('edit-toggle-label');
            if (editMode) {
                btn.className = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-xl border border-emerald-500/50 bg-emerald-500/20 text-emerald-300 hover:text-white transition-all flex items-center gap-1.5 whitespace-nowrap";
                label.innerText = 'Готово';
                btn.querySelector('i').setAttribute('data-lucide', 'check');
            } else {
                btn.className = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-xl border border-slate-700 bg-slate-800 text-slate-300 hover:text-white transition-all flex items-center gap-1.5 whitespace-nowrap";
                label.innerText = 'Редактировать';
                btn.querySelector('i').setAttribute('data-lucide', 'pencil');
            }
            renderSlide(currentSlide);
            lucide.createIcons();
        };

        // ===== ОБЛАКО / ЛОКАЛЬНОЕ СОХРАНЕНИЕ =====
        function setSyncStatus(text, color) {
            document.getElementById('sync-text').innerText = text;
            document.getElementById('sync-status').className = `text-[11px] flex items-center gap-1 ${color}`;
        }

        function loadLocal() {
            try {
                const raw = localStorage.getItem(LOCAL_KEY);
                if (raw) userData = JSON.parse(raw) || {};
            } catch (e) { console.warn('Local load error', e); }
        }

        function saveLocal() {
            try { localStorage.setItem(LOCAL_KEY, JSON.stringify(userData)); } catch (e) { console.warn('Local save error', e); }
        }

        async function loadFromCloud() {
            if (!CLOUD_ENABLED) { setSyncStatus('Локально', 'text-slate-500'); return; }
            setSyncStatus('Загрузка...', 'text-slate-400');
            try {
                const res = await fetch(`${BIN_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                const record = json.record || {};
                if (record && typeof record === 'object') {
                    userData = record;
                    saveLocal();
                    renderSlide(currentSlide);
                    renderGridCards();
                    renderGrandTotal();
                }
                setSyncStatus('Синхронизировано', 'text-emerald-400');
            } catch (e) {
                console.error('Cloud load error', e);
                setSyncStatus('Ошибка облака', 'text-japanRed');
            }
        }

        async function saveToCloud() {
            if (!CLOUD_ENABLED) return;
            setSyncStatus('Сохранение...', 'text-slate-400');
            try {
                const res = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(userData)
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                setSyncStatus('Сохранено', 'text-emerald-400');
            } catch (e) {
                console.error('Cloud save error', e);
                setSyncStatus('Ошибка сохранения', 'text-japanRed');
            }
        }

        function saveChanges() {
            saveLocal(); // локально — сразу
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { saveToCloud(); }, 1200);
        }

        function getEffectiveDayData(index) {
            const baseDay = defaultTripData[index];
            const userDay = userData[`day_${baseDay.day}`] || {};
            let customItems = userDay.customItems || baseDay.customItems;
            if (!customItems) {
                const oldCustom = userDay.budget?.custom ?? baseDay.budget.custom;
                customItems = oldCustom > 0 ? [{ label: 'Прочее', amount: oldCustom }] : [];
            }
            const customSum = customItems.reduce((s, i) => s + (parseInt(i.amount, 10) || 0), 0);
            return {
                ...baseDay,
                cityTag: userDay.cityTag !== undefined ? userDay.cityTag : baseDay.cityTag,
                title: userDay.title !== undefined ? userDay.title : baseDay.title,
                subtitle: userDay.subtitle !== undefined ? userDay.subtitle : baseDay.subtitle,
                images: userDay.images || baseDay.images,
                customItems: customItems,
                budget: {
                    food: userDay.budget?.food !== undefined ? userDay.budget.food : baseDay.budget.food,
                    transport: userDay.budget?.transport !== undefined ? userDay.budget.transport : baseDay.budget.transport,
                    custom: customSum
                },
                timeline: userDay.timeline || baseDay.timeline
            };
        }

        window.switchMode = function(mode) {
            document.getElementById('view-presentation').classList.add('hidden');
            document.getElementById('view-grid').classList.add('hidden');
            const inactiveBtn = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all whitespace-nowrap";
            const activeBtn = "px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all bg-japanRed text-white shadow whitespace-nowrap";
            document.getElementById('btn-mode-presentation').className = inactiveBtn;
            document.getElementById('btn-mode-grid').className = inactiveBtn;
            if (mode === 'presentation') {
                document.getElementById('view-presentation').classList.remove('hidden');
                document.getElementById('btn-mode-presentation').className = activeBtn;
            } else if (mode === 'grid') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('btn-mode-grid').className = activeBtn;
                renderGrandTotal();
                renderGridCards();
            }
        };

        function initPresentationDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            defaultTripData.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-2.5 h-2.5 rounded-full transition shrink-0 ${idx === 0 ? 'bg-japanRed scale-125' : 'bg-slate-700 hover:bg-slate-500'}`;
                btn.onclick = () => window.goToSlide(idx);
                container.appendChild(btn);
            });
        }

        function renderSlide(index) {
            currentSlide = index;
            const eff = getEffectiveDayData(index);
            document.getElementById('slide-indicator').innerText = `${eff.date} (День ${eff.day})`;
            document.getElementById('slide-date-tag').innerText = eff.date;
            document.getElementById('slide-city-input').value = eff.cityTag;
            document.getElementById('slide-title-input').value = eff.title;
            document.getElementById('slide-subtitle-input').value = eff.subtitle;
            document.getElementById('budget-food-input').value = eff.budget.food;
            document.getElementById('budget-transport-input').value = eff.budget.transport;
            renderCustomItems(eff.customItems);
            recalculateSlideBudget(eff.budget);

            const gallery = document.getElementById('slide-photo-gallery');
            gallery.innerHTML = '';
            if (eff.images.length === 0 && !editMode) {
                gallery.innerHTML = `<div class="col-span-full h-40 flex items-center justify-center text-slate-600 text-sm border border-dashed border-slate-700 rounded-2xl">Нет фотографий</div>`;
            }
            eff.images.forEach((imgUrl, imgIdx) => {
                const card = document.createElement('div');
                card.className = 'photo-card relative rounded-2xl overflow-hidden border border-slate-700 bg-slate-900 group';
                card.innerHTML = `
                    <img src="${imgUrl}" alt="Фото" class="w-full h-full object-cover" />
                    <button onclick="removePhoto(${imgIdx})" class="edit-only absolute top-2 right-2 bg-slate-950/80 text-red-400 hover:text-red-300 p-2 rounded-xl border border-slate-700 transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>`;
                gallery.appendChild(card);
            });

            const timelineContainer = document.getElementById('slide-timeline');
            timelineContainer.innerHTML = '';
            eff.timeline.forEach((item, tIdx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-slate-800/60 p-2 rounded-xl border border-slate-700/60';
                row.innerHTML = `
                    <input type="text" value="${item.time.replace(/"/g,'&quot;')}" oninput="updateTimelineItem(${tIdx}, 'time', this.value)" class="field-input w-20 bg-slate-900 text-xs text-japanGold font-bold px-2 py-1 rounded border border-slate-700 outline-none text-center shrink-0" />
                    <input type="text" value="${item.text.replace(/"/g,'&quot;')}" oninput="updateTimelineItem(${tIdx}, 'text', this.value)" class="field-input flex-1 bg-slate-900 text-xs text-slate-200 px-3 py-1 rounded border border-slate-700 outline-none" />
                    <button onclick="removeTimelineItem(${tIdx})" class="edit-only text-slate-400 hover:text-red-400 p-1 shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>`;
                timelineContainer.appendChild(row);
            });

            const dots = document.getElementById('dots-container').children;
            Array.from(dots).forEach((dot, idx) => {
                dot.className = `w-2.5 h-2.5 rounded-full transition shrink-0 ${idx === index ? 'bg-japanRed scale-125' : 'bg-slate-700 hover:bg-slate-500'}`;
            });
            lucide.createIcons();
        }

        function renderCustomItems(items) {
            const list = document.getElementById('custom-items-list');
            list.innerHTML = '';
            const sum = items.reduce((s, i) => s + (parseInt(i.amount, 10) || 0), 0);
            document.getElementById('custom-sum-badge').innerText = `(¥${sum.toLocaleString()})`;
            if (items.length === 0) {
                list.innerHTML = `<div class="text-[10px] text-slate-500 text-center py-1">Нет пунктов</div>`;
                return;
            }
            items.forEach((item, i) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-1.5';
                row.innerHTML = `
                    <input type="text" value="${(item.label||'').replace(/"/g,'&quot;')}" oninput="updateCustomItem(${i}, 'label', this.value)" placeholder="Название" class="field-input flex-1 bg-slate-900 text-[11px] text-slate-200 px-2 py-1 rounded border border-slate-700 outline-none focus:border-japanGold" />
                    <input type="number" value="${item.amount || 0}" oninput="updateCustomItem(${i}, 'amount', this.value)" placeholder="¥" class="field-input w-16 bg-slate-900 text-[11px] text-japanGold font-bold text-center px-1 py-1 rounded border border-japanGold/40 outline-none focus:border-japanGold" />
                    <button onclick="removeCustomItem(${i})" class="edit-only text-slate-400 hover:text-red-400 p-0.5 shrink-0"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>`;
                list.appendChild(row);
            });
            lucide.createIcons();
        }

        function ensureUserDay() {
            const key = `day_${defaultTripData[currentSlide].day}`;
            if (!userData[key]) userData[key] = JSON.parse(JSON.stringify(getEffectiveDayData(currentSlide)));
            if (!userData[key].customItems) userData[key].customItems = [];
            return key;
        }

        window.addCustomItem = function() {
            const key = ensureUserDay();
            userData[key].customItems.push({ label: '', amount: 0 });
            renderSlide(currentSlide);
            saveChanges();
        };

        window.updateCustomItem = function(index, field, val) {
            const key = ensureUserDay();
            userData[key].customItems[index][field] = field === 'amount' ? (parseInt(val, 10) || 0) : val;
            const eff = getEffectiveDayData(currentSlide);
            renderCustomItemsBadgeOnly(eff.customItems);
            recalculateSlideBudget(eff.budget);
            renderGrandTotal();
            saveChanges();
        };

        function renderCustomItemsBadgeOnly(items) {
            const sum = items.reduce((s, i) => s + (parseInt(i.amount, 10) || 0), 0);
            document.getElementById('custom-sum-badge').innerText = `(¥${sum.toLocaleString()})`;
        }

        window.removeCustomItem = function(index) {
            const key = ensureUserDay();
            userData[key].customItems.splice(index, 1);
            renderSlide(currentSlide);
            renderGrandTotal();
            saveChanges();
        };

        window.updateSlideField = function(field, val) {
            const key = ensureUserDay();
            userData[key][field] = val;
            saveChanges();
        };

        window.updateCurrentBudget = function(category, val) {
            const num = parseInt(val, 10) || 0;
            const key = ensureUserDay();
            if (!userData[key].budget) userData[key].budget = { food: 0, transport: 0, custom: 0 };
            userData[key].budget[category] = num;
            const eff = getEffectiveDayData(currentSlide);
            recalculateSlideBudget(eff.budget);
            renderGrandTotal();
            saveChanges();
        };

        function recalculateSlideBudget(b) {
            const total = (b.food || 0) + (b.transport || 0) + (b.custom || 0);
            const rub = Math.round(total * 0.65);
            document.getElementById('budget-total-jpy').innerText = `~¥${total.toLocaleString()}`;
            document.getElementById('budget-total-sub').innerText = `(~${rub.toLocaleString()} ₽)`;
        }

        window.addTimelineItem = function() {
            const key = ensureUserDay();
            if (!userData[key].timeline) userData[key].timeline = [];
            userData[key].timeline.push({ time: '12:00', text: 'Новое событие' });
            renderSlide(currentSlide);
            saveChanges();
        };

        window.updateTimelineItem = function(index, field, val) {
            const key = ensureUserDay();
            userData[key].timeline[index][field] = val;
            saveChanges();
        };

        window.removeTimelineItem = function(index) {
            const key = ensureUserDay();
            userData[key].timeline.splice(index, 1);
            renderSlide(currentSlide);
            saveChanges();
        };

        window.removePhoto = function(index) {
            const key = ensureUserDay();
            userData[key].images.splice(index, 1);
            renderSlide(currentSlide);
            renderGridCards();
            saveChanges();
        };

        document.getElementById('image-upload-input').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const key = ensureUserDay();
            let processed = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 900;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; }
                        else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
                        canvas.width = w; canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        const base64 = canvas.toDataURL('image/jpeg', 0.6);
                        userData[key].images.push(base64);
                        processed++;
                        if (processed === files.length) {
                            renderSlide(currentSlide);
                            renderGridCards();
                            saveChanges();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        });

        window.nextSlide = function() { if (currentSlide < defaultTripData.length - 1) renderSlide(currentSlide + 1); };
        window.prevSlide = function() { if (currentSlide > 0) renderSlide(currentSlide - 1); };
        window.goToSlide = function(index) { renderSlide(index); window.switchMode('presentation'); };

        function renderGrandTotal() {
            let f = 0, t = 0, c = 0;
            defaultTripData.forEach((_, idx) => {
                const b = getEffectiveDayData(idx).budget;
                f += b.food || 0; t += b.transport || 0; c += b.custom || 0;
            });
            const sum = f + t + c;
            const rub = Math.round(sum * 0.65);
            document.getElementById('grand-total-food').innerText = `¥${f.toLocaleString()}`;
            document.getElementById('grand-total-transport').innerText = `¥${t.toLocaleString()}`;
            document.getElementById('grand-total-custom').innerText = `¥${c.toLocaleString()}`;
            document.getElementById('grand-total-all-jpy').innerText = `¥${sum.toLocaleString()}`;
            document.getElementById('grand-total-all-sub').innerText = `(~${rub.toLocaleString()} ₽)`;
        }

        function renderGridCards() {
            const container = document.getElementById('grid-container');
            if (!container) return;
            container.innerHTML = '';
            defaultTripData.forEach((_, idx) => {
                const eff = getEffectiveDayData(idx);
                const b = eff.budget;
                const total = (b.food || 0) + (b.transport || 0) + (b.custom || 0);
                const thumb = eff.images[0] || 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1000&q=80';
                const card = document.createElement('div');
                card.className = 'bg-cardDark border border-slate-700/80 rounded-3xl overflow-hidden hover:border-japanRed/60 transition cursor-pointer flex flex-col justify-between group shadow-xl';
                card.onclick = () => window.goToSlide(idx);
                card.innerHTML = `
                    <div class="h-48 w-full relative overflow-hidden bg-slate-900">
                        <img src="${thumb}" alt="" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                        <div class="absolute top-4 left-4">
                            <span class="text-xs font-bold uppercase tracking-wider text-japanRed bg-slate-950/80 px-3 py-1 rounded-lg border border-japanRed/30 backdrop-blur-sm">${eff.date}</span>
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                            <h3 class="text-lg font-bold text-white group-hover:text-japanRed transition">${eff.title}</h3>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">${eff.subtitle}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-800 space-y-3">
                            <div class="grid grid-cols-3 text-xs text-slate-300 text-center bg-slate-900 p-2 rounded-xl border border-slate-800">
                                <div>🍜 ¥${(b.food||0).toLocaleString()}</div>
                                <div>🚆 ¥${(b.transport||0).toLocaleString()}</div>
                                <div class="text-japanGold font-semibold">🎟️ ¥${(b.custom||0).toLocaleString()}</div>
                            </div>
                            <div class="flex items-center justify-between text-xs pt-1">
                                <span class="text-japanGold font-bold flex items-center gap-1"><i data-lucide="wallet" class="w-4 h-4"></i> ~¥${total.toLocaleString()}</span>
                                <span class="text-japanRed font-semibold group-hover:underline flex items-center">Открыть <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i></span>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
            renderGrandTotal();
            lucide.createIcons();
        }
    </script>
</body>
</html>
